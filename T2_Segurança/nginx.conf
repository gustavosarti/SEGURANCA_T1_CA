server {
    listen 443 ssl;
    server_name localhost;

    # O Nginx vai ler os arquivos que geraremos com OpenSSL
    ssl_certificate /etc/nginx/certs/fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}